name: pr_to_main

on:
  pull_request:
    branches:
      - main

jobs:
  pr_to_main:
    name: pr_to_main
    runs-on: ubuntu-latest

    env:
      RUSTFS_ACCESS_KEY: ci
      RUSTFS_SECRET_KEY: ci
      RUSTFS_ENDPOINT: localhost:9000
      DUCKLAKE_CATALOG_USER: ci
      DUCKLAKE_CATALOG_PASSWORD: ci
      DUCKLAKE_CATALOG_DB: ci
      DUCKLAKE_CATALOG_HOST: localhost
      DUCKLAKE_CATALOG_PORT: "5432"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install venv + build
        shell: bash -l {0}
        run: |
          chmod +x utils/setup_env.sh
          . utils/setup_env.sh
          make build
          cd dbt && ../.venv/bin/dbt parse
